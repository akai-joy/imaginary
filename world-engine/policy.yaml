# policy.yaml — single source of runtime config for World Engine.
#
# Read by: the Moderation node, Scoring, the Showcase subgraph (trigger + cost
# control), and the Security guardrail Plugin. Flip `active_profile` to demo
# strict vs. permissive behaviour from one place.
#
# HARD BLOCK categories are non-negotiable and identical across every profile.

active_profile: default        # strict | default | permissive

# ---------------------------------------------------------------------------
# Models (cheap where possible; Pro only for synthesis-quality work)
# ---------------------------------------------------------------------------
models:
  router:          gemini-flash
  moderation:      gemini-flash
  continuity:      gemini-flash
  scoring:         gemini-flash
  cartographer:    gemini-flash         # cheap structured map-placement proposal
  narrator:        gemini-pro
  storyboard:      gemini-pro
  security_screen: gemini-flash-lite     # cheap pre-screen; NOT the only defense
  tts:             gemini-2.5-flash-preview-tts   # Gemini native TTS (chronicle voice-over)

# ---------------------------------------------------------------------------
# Content & safety (Moderation node)
# ---------------------------------------------------------------------------
moderation:
  hard_block:                            # never allowed, any profile, no exceptions
    - minor_sexualization
    - illegal_synthesis_instructions     # drugs / weapons / explosives how-to
    - threats_doxxing_real_people
  profiles:
    strict:
      block: [explicit_sexual, gore_extreme_violence, hate_harassment,
              drug_reference, mild_violence]
      flag:  []
    default:
      block: [explicit_sexual, gore_extreme_violence, hate_harassment]
      flag:  [mature_nonexplicit, drug_reference_noninstructional, narrative_violence]
    permissive:
      block: [explicit_sexual, gore_extreme_violence, hate_harassment]
      flag:  [mature_nonexplicit]
  hidden_content_scan:
    enabled: true
    detect: [acrostic, base64, hex, zero_width, unusual_unicode, steganography]
    on_detect: block_and_strip
  prompt_injection_scan:
    enabled: true
    on_detect: block_and_strip

# ---------------------------------------------------------------------------
# Scoring / Critic
# ---------------------------------------------------------------------------
scoring:
  weights: { creativity: 0.4, consistency: 0.3, build_on: 0.3 }
  range: [0, 100]                        # controller CLAMPS proposals to this range
  points_multiplier: 1                   # ledger points = clamped_score * multiplier

# ---------------------------------------------------------------------------
# Chronicle: the world's own storyteller voice ("what we know so far").
#
# Read-only, on-demand synthesis over the world's storylines. The narrator is
# the SAME role every age — the keeper-and-teller of the people's stories — but
# the FORM that role takes shifts with the era the world evokes: firelit shaman,
# wandering bard, present-day influencer. Selection is a cheap keyword match on
# the world's free-text `theme`; no genre enum, no LLM persona inference.
# ---------------------------------------------------------------------------
chronicle:
  model: narrator              # reuse the narrator model role (gemini-pro synthesis)
  cache: true                  # cache by (world_id, canon_count); story count changes -> regen
  max_storylines: 12           # cap input breadth so synthesis stays cheap + on-tempo
  default_persona: bard        # fallback when no era keyword matches the theme
  tts:
    enabled: true              # synthesize the chronicle once, cache the audio, attach audio_url
  # First persona whose keywords appear in the lowercased world theme wins.
  # `voice` shapes the LLM prose AND the TTS delivery style; `voice_name` is the
  # Gemini prebuilt TTS voice chosen to fit the era's teller.
  personas:
    shaman:
      label: "The Shaman"
      keywords: [prehistoric, stone age, primal, tribal, ice age, neolithic, cave]
      voice: "a firelit tribal shaman recounting the deeds of the ancestors in oral, rhythmic cadence"
      voice_name: Algenib       # gravelly, grave — an elder at the fire
    bard:
      label: "The Bard"
      keywords: [medieval, wizard, fantasy, kingdom, knight, dragon, magic, sword]
      voice: "a wandering medieval bard performing the saga in warm, lyrical storyteller's prose"
      voice_name: Sulafat       # warm, performing
    chronicler:
      label: "The Court Chronicler"
      keywords: [renaissance, baroque, victorian, empire, colonial, age of sail]
      voice: "a meticulous court chronicler setting down the histories in measured, formal prose"
      voice_name: Iapetus       # clear, measured
    influencer:
      label: "The Influencer"
      keywords: [modern, present, current, contemporary, today, urban, social media]
      voice: "a present-day social influencer breathlessly recapping the drama for their followers"
      voice_name: Laomedeia     # upbeat, breathless
    storybot:
      label: "The Story-Bot"
      keywords: [futuristic, robot, sci-fi, cyber, space, neon, android, ai]
      voice: "a clear futuristic story-AI speaking in a steady, informative, and clear voice (no whispering), streaming the chronicle as an archival broadcast"
      voice_name: Charon        # calm, informative broadcast
  default_voice_name: Sulafat   # used when a matched persona has no voice_name

# ---------------------------------------------------------------------------
# Showcase subgraph: trigger + deliberate cost control
# ---------------------------------------------------------------------------
showcase:
  trigger:
    min_votes: 10
    min_composite_score: 70
    rank_weight: { votes: 0.6, score: 0.4 }
  media:
    default: comic                       # every qualifying tree gets a cheap comic
    reel_for_top_n: 1                    # ONLY the single top tree per cycle gets a reel
    comic:
      provider: imagen                   # Google-native image generation (Imagen / Gemini image)
      panels: { min: 6, max: 8 }
    reel:
      provider: veo
      model_tier: lite                   # lite | fast | quality
      audio: false                       # Veo silent; Gemini TTS VO layered on top
      aspect_ratio: "9:16"
      max_clip_seconds: 8                # Veo hard limit per generation
      scenes: 3                          # chained -> ~24s reel
    cache_assets: true                   # never regenerate identical content
  publish:
    mode: mock                           # mock | live  (live is OUT OF SCOPE)
    gcs_bucket: world-engine-showcase
    gcs_prefix_per_job: true

# ---------------------------------------------------------------------------
# Media generation providers (keys come from Secret Manager, never inline)
# ---------------------------------------------------------------------------
media_providers:
  image:
    provider: imagen                     # Google-native: Vertex AI Imagen / Gemini image
    model: imagen-3.0-generate-002       # matches app/agents/media.py (Gemini image as fallback)
    quality: medium                      # low | medium | high
    size_landscape: "1536x1024"
    size_portrait: "1024x1536"
  voice:
    provider: gemini                     # Google-native Gemini text-to-speech
    model: gemini-2.5-flash-preview-tts
    settings: { stability: 0.5, similarity_boost: 0.75, style: 0.0 }
  video:
    provider: veo
    model_tier: lite
    aspect_ratio: "9:16"
    silent: true                         # narration comes from the voice provider
  # Per-character voices so a character sounds the same everywhere it appears.
  voice_registry:
    _narrator: "Kore"                    # Gemini TTS prebuilt voice name
    # <character_canon_id>: "<gemini_tts_voice_name>"
  # Per-panel media tiering for the explorable-graph scenes.
  panel_tiering:
    default_kind: image                  # every panel = image + VO
    video_when: key                      # only panels the storyboard flags `key` get Veo
    max_video_panels_per_scene: 2

# ---------------------------------------------------------------------------
# Season / drop lifecycle (the time-boxed contribution window)
# ---------------------------------------------------------------------------
season:
  drop_days: 14          # default contribution-window length for a new drop
  auto_rollover: false   # opening the next drop on close stays manual for now

# ---------------------------------------------------------------------------
# Security guardrail Plugin (registered once on the Runner)
# ---------------------------------------------------------------------------
security:
  spotlight_untrusted: true              # wrap user input AND canon-on-readback as data
  pii_redaction: true
  output_filters:
    block_html_js: true
    block_img_tags: true
    url_allowlist: [storage.googleapis.com]   # any other URL stripped from output
  # Per-agent tool allowlist. Content-reading agents get NO dangerous tools;
  # only the deterministic controller may mutate state.
  tools:
    intake:      [canon_read]
    moderation:  []
    continuity:  [canon_read]
    provenance:  [canon_read]
    scoring:     [canon_read]
    narrator:    [canon_read]            # proposes the canon entry; controller writes it
    storyboard:  [canon_read]
    media:       [imagen, veo, gcs_write_job_prefix]
    controller:  [canon_write, ledger_write, gcs_write_job_prefix, publish_mock]
  dangerous_actions_require_confirmation: [deploy, canon_delete, publish_live]

# ---------------------------------------------------------------------------
# Abuse controls (blunt automated injection spraying)
# ---------------------------------------------------------------------------
rate_limits:
  contributions_per_user_per_hour: 20
  votes_per_user_per_tree: 1
  max_contribution_chars: 4000
